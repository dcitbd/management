<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="dcitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Icon Emblem -->
  <g transform="translate(15, 15)">
    <rect x="0" y="0" width="90" height="90" rx="22" fill="#0f172a" stroke="url(#dcitGrad)" stroke-width="2.5" />
    <path d="M25 45 L45 25 L65 45 L45 65 Z" fill="none" stroke="url(#dcitGrad)" stroke-width="3" filter="url(#glow)" />
    <circle cx="45" cy="45" r="10" fill="url(#purpleGrad)" />
    <path d="M45 20 L45 70 M20 45 L70 45" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
  </g>
  <!-- Brand Text -->
  <text x="125" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    DREAM CAREER <tspan fill="url(#dcitGrad)">IT</tspan>
  </text>
  <text x="125" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="2">
    AI BUSINESS SUITE &bull; BANGLADESH
  </text>
</svg>
